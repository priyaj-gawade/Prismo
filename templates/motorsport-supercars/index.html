<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1440, initial-scale=1.0">
  <title>Motorsport Supercars Editorial Poster</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <main class="poster-artboard" data-od-id="poster-root">
    
    <!-- Full-Bleed Hero Image with Directional Dark Vignette / Scrim -->
    <div class="hero-image-container" data-od-id="hero-image-container">
      <img src="https://images.unsplash.com/photo-1614162692292-7ac56d7f7f1e?q=80&w=1920&auto=format&fit=crop" alt="High performance track car" class="poster-bleed-image" data-od-id="poster-bleed-image">
      <!-- Scrim direction follows text: text at bottom == dark gradient at bottom -->
      <div class="poster-scrim scrim-bottom" data-od-id="poster-scrim"></div>
    </div>

    <!-- Top Minimalist Header -->
    <header class="poster-header" data-od-id="poster-header">
      <div class="brand-tag" data-od-id="brand-tag">PORSCHE MOTORSPORT</div>
      <div class="model-code" data-od-id="model-code">911 GT3 RS</div>
    </header>

    <!-- Bottom Content Stack with High-Contrast Typography -->
    <div class="content-stack" data-od-id="content-stack">
      <h1 class="poster-headline" data-od-id="poster-headline">
        <span class="headline-primary" data-od-id="headline-primary">The Art of Pure</span>
        <span class="headline-accent" data-od-id="headline-accent">Downforce.</span>
      </h1>

      <p class="poster-subtext" data-od-id="poster-subtext">
        Naturally aspirated 4.0-liter flat-six delivering 518 horsepower at 9,000 RPM, paired with active DRS aerodynamics derived directly from GT3 racing.
      </p>

      <!-- Minimal Spec Strip (Max 2-3 items, No UI Cards, Zero Status Dots) -->
      <div class="spec-strip" data-od-id="spec-strip">
        <div class="spec-item" data-od-id="spec-1">
          <span class="spec-value">860 kg</span>
          <span class="spec-label">Downforce @ 285 km/h</span>
        </div>
        <div class="spec-divider" aria-hidden="true"></div>
        <div class="spec-item" data-od-id="spec-2">
          <span class="spec-value">9,000</span>
          <span class="spec-label">Max Engine RPM</span>
        </div>
      </div>
    </div>

  </main>
</body>
</html>
