<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1440, initial-scale=1.0">
  <title>Swiss International Style Poster</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800;900&family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <main class="poster-artboard" data-od-id="poster-root">
    <header class="poster-hero" data-od-id="hero-header">
      <div class="tape-badge" data-od-id="category-badge">SWISS INTERNATIONAL</div>
      <h1 class="poster-headline" data-od-id="headline">
        <span class="headline-primary" data-od-id="headline-primary">Pure Geometric</span>
        <span class="headline-accent" data-od-id="headline-accent">Structure</span>
      </h1>
      <p class="poster-subtext" data-od-id="supporting-copy">
        Clean typographic rhythm and mathematical tension across asymmetric planes.
      </p>
    </header>

    <section class="poster-focal-frame" data-od-id="hero-image-frame">
      <img src="assets/focal.jpg" alt="Focal Subject" class="poster-focal-img" data-od-id="hero-image">
    </section>

    <footer class="poster-footer" data-od-id="source-credit">
      <div class="spec-block" data-od-id="spec-1">
        <span class="spec-label">PROPORTION</span>
        <span class="spec-value">1 : 1.618</span>
      </div>
      <div class="spec-block" data-od-id="spec-2">
        <span class="spec-label">GRID SYSTEM</span>
        <span class="spec-value">12-Col Asymmetric</span>
      </div>
    </footer>
  </main>
</body>
</html>
